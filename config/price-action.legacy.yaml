# ============================================================
# PABot 全局配置文件
# 回测 / 模拟盘 / 实盘 共用同一份策略与风控参数，
# 保证"回测出来的系统"和"实际交易的系统"完全一致。
# ============================================================

data:
  cache_dir: data_cache        # 本地行情缓存目录（parquet 格式）
  start: "2013-01-01"          # 数据下载起点（比回测起点提前 2 年，预留指标回看窗口）
  end: "2025-12-31"            # 数据下载终点
  snapshot: "20260727"         # 数据快照 ID。设置后回测/walkforward
                               # 固定读只读快照，实验完全可复现、不受 yfinance
                               # 复权漂移影响。用 python main.py snapshot 创建。

universe:
  mode: sp500_pit              # 股票池模式：
                               #   sp500_pit = 标普 500 点时成分股（信号日当天真实的
                               #               指数成员才可入场，消除选股幸存者偏差）
                               #   static    = data/universe.py 中的固定名单（约 70 只，
                               #               有幸存者偏差，回测结果偏乐观，仅供快速实验）
  top_adv: 100                 # 流动性池：每天只允许 63 日滚动成交额排名前 N 的股票
                               # 入场（0 = 不限制）。用"当时的成交额"重构大盘股池，
                               # 点时可计算、无后见之明。宽池模式下必开——
                               # 消融显示不开时年化从 13.5% 跌至 6.8%

backtest:
  start: "2015-01-01"          # 回测起始日
  end: "2025-12-31"            # 回测结束日
  initial_capital: 100000      # 初始资金（美元）
  slippage_bps: 5              # 单边滑点，万分之五（5 个基点）
  commission_per_share: 0.0    # 每股佣金（Alpaca 为零佣金）
  cash_yield: true             # 闲置现金按 13 周国债利率（^IRX）逐日计息，
                               # 模拟实盘中现金买 SGOV/BIL 短债 ETF 的收益

strategy:
  breakout_window: 55          # 突破入场：收盘价创 55 日新高（唐奇安通道思想，经典价格行为突破）
  exit_window: 45              # 离场：收盘价跌破 45 日最低价（趋势结构破坏）
  atr_window: 14               # ATR（真实波幅均值）计算窗口，用于止损与仓位
  atr_stop_mult: 2.5           # 初始止损 = 入场价 - 2.5 * ATR
  atr_trail_mult: 4.5          # 吊灯跟踪止损 = 入场后最高收盘价 - 4.5 * ATR
  swing_k: 3                   # 摆动点识别的左右分形宽度（确认滞后 k 根 K 线，避免未来函数）
  momentum_window: 126         # 个股动量过滤窗口（约 6 个月）
  momentum_filter: absolute    # 动量过滤模式：absolute = 半年涨幅 > 0；
                               # relative = 半年涨幅须跑赢 SPY（消融实验证伪，勿开）
  rank_by: sharpe_momentum     # 候选排序：momentum = 原始 12-1 动量；
                               # sharpe_momentum = 动量/波动率（宽池模式下必选——
                               # 原始动量在数百只候选中总是挑到最极端的板块脉冲；
                               # static 小池上原始动量略优）
  pullback_depth_atr: 1.5      # 回调入场：距 10 日高点回撤深度需 >= 1.5 * ATR 才算有效回调
  earnings_avoid_days: 0       # 财报回避：入场信号若未来 N 个日历日内有财报则跳过
                               # （0 = 关闭；财报日历取不到的股票自动不过滤）
  use_inside_bar: false        # ★ 内包线第三触发已证伪（-1.9pp，仅增 9 笔边际交易，
                               # 与吞没/锤子高度重叠）。勿开启。
  use_weekly_confirm: false    # ★ 周线多时间框架确认已证伪（统计显著有害：
                               # -6.4pp，p=0.03，CI 全负；2000-14 亦恶化）——
                               # 周线结构确认太慢，滤掉的恰是趋势早期最佳入场。勿开启。
  time_stop_days: 0            # ★ 时间止损已被 walk-forward 样本外证伪：
                               # 消融方向为正但不显著（+0.2~2.2pp, p>0.2），
                               # 逐年折训练窗每折都选中它（样本内诱人），
                               # 但拼接样本外 +6.5% 输给无时间止损的默认 +8.4%。
                               # 样本内吸引力不能泛化，维持关闭。
  time_stop_min_r: 1.0         # 时间止损的达标线（保留供研究）
  # ---- 金字塔加仓（海龟式，把资金集中到已被证明正确的趋势上） ----
  pyramid_max_adds: 2          # 每笔持仓最多加仓次数（0 = 关闭）
  pyramid_trigger_r: 2.0       # 每浮盈多少倍初始风险 R 触发一次加仓
  pyramid_size_frac: 0.5       # 加仓规模 = 标准风险单位的多少倍

risk:
  risk_per_trade: 0.025        # 单笔交易风险预算：账户权益的 2.5%（入场价到止损价的亏损额）
  max_positions: 10            # 最大同时持仓数
  max_weight: 0.20             # 单只股票市值占权益上限 20%
  max_per_sector: 3            # 同一 GICS 行业最多持仓数（0 = 不约束）；
                               # 动量排序爱扎堆热门板块（2022 年曾同时抓 3 只能源被埋）
  dedup_share_classes: true    # 同公司多股别去重（GOOG/GOOGL 不同时持有）。
                               # 消融：样本内 -0.48pp（p=0.72，噪声内），
                               # 换取单一公司风险减半——按风险卫生采纳

# ---- 熊市做空模块 ----
# 大盘开关档位 0（系统性熊市）时允许做空：LH+LL 下降结构 +
# 跌破 55 日低点入场，风控为多头的镜像（ATR/结构止损 + 空头吊灯 +
# 升破 45 日高点回补），含融券成本。默认开关由消融实验决定。
shorts:
  enabled: false
  max_positions: 5             # 空头独立仓位上限（与多头分开计数）
  borrow_rate: 0.01            # 融券年化费率（大盘股典型 0.3%~1%，取保守值）

# ---- SPY 底仓（研究模块，实验证伪后默认关闭） ----
# 大盘开关全额档时，未被个股信号用掉的资金买入 SPY 底仓；
# 个股入场需要资金时优先卖出 SPY 置换；开关跌下全额档时清空底仓。
# ★ 消融结论（2015-2025 点时池）：无底仓 14.6%/-22.9%，
#   加底仓 13.6~14.7%/-25~-26%——收益不升、回撤加深。
#   原因：闲置现金本就吃着 ^IRX 利息且被策略机会性调用，
#   换成 SPY 只增加了 β 回撤。保留代码供研究，不建议开启。
base_position:
  enabled: false
  symbol: SPY                  # 底仓标的（与大盘开关基准一致）
  min_level: 2                 # 开关档位 >= 该值才持有底仓（2 = 仅全额档）
  cash_buffer: 0.02            # 保留权益的 2% 现金不买底仓（应付滑点与加仓）

# ---- 波动率目标与杠杆（研究模块，实验证伪后默认关闭） ----
# 思想：让组合波动率向目标值看齐——平静的趋势市中放大仓位（最高 max_leverage 倍），
# 高波动的混乱市中自动降杠杆。杠杆倍数 f = clip(目标波动率 / 已实现波动率, min, max)，
# 作用于新开仓与加仓的规模及总购买力，不强制调整已有持仓（避免高频调仓摩擦）。
# ★ 消融实验结论（2015-2025，8 个参数变体）：全部劣于无杠杆基线——
#   本系统的暴露已由大盘开关与止损内生调节，已实现波动率缩放恰好在
#   主升段（波动上升）压仓、在平静期（波动爆发前）加满，方向反了。
#   保留代码供研究，不建议开启；开启前另需自行实现 live runner 侧的支持。
leverage:
  enabled: false
  target_vol: 0.18             # 目标年化波动率（回测未开杠杆时组合约 17%）
  vol_window: 20               # 已实现波动率的回看窗口（交易日）
  max_leverage: 1.5            # 杠杆上限（Alpaca Reg-T 保证金账户支持 2x，留安全边际）
  min_leverage: 0.5            # 下限：高波动期最低降到半仓规模
  margin_spread: 0.015         # 融资利差：负现金按 (^IRX + 1.5%) 年化计息

regime:
  symbol: SPY                  # 大盘风控基准（标普 500 ETF）
  momentum_window: 126         # SPY 6 个月动量 > 0 → 档位 2（允许开仓），否则 0（停止开仓）
  recovery_window: null        # ★ 三档分级已被 2000-2014 扩展回测证伪后关闭：
                               # 1 档"复苏半仓"在 2000-02 的多轮熊市反弹中反复接飞刀，
                               # 使该段回撤从 -26.8% 恶化到 -47.4%、2008 从 -6.8% 到 -20.4%；
                               # 且在 2015-2025 宽池上二值(13.7%)本就不逊于分级(13.5%)。
                               # 设为 63 可恢复三档模式（不建议）。
  structural_reopen: false     # ★ 结构化重开（SPY 创 55 日新高即恢复开仓）已证伪：
                               # 2015-25 仅 +0.17pp(p=0.95)，而 2000-02 回撤 -26%→-30.4%、
                               # 2008 从 -6.4%→-10.8%——熊市反弹恰恰能摸到 55 日高点，
                               # "结构性证据更难伪造"的假设不成立。勿开启。
  reopen_window: 55            # 结构化重开的新高窗口（保留供研究）

broker:
  provider: alpaca             # 券商：Alpaca（同一套 API 支持模拟盘与实盘）
  paper: true                  # true = 模拟盘（paper trading），false = 实盘
  # API 密钥不写入配置文件，从环境变量读取：
  #   export ALPACA_API_KEY=xxx
  #   export ALPACA_SECRET_KEY=xxx

live:
  state_file: live_state.json  # 实盘/模拟盘本地状态文件（记录每个持仓的止损位等）
  cache_dir: data_cache_live   # 实盘专用行情缓存（每日强制刷新写这里，
                               # 与研究用 data_cache 物理隔离，杜绝刷新污染实验数据）
  reconcile_max_cache_age_days: 4  # 仅用于覆盖周末/单日休市；生产禁止调大

# ---- 价格行为复盘证据账本 ----
# 只记录当时可知的决策证据、订单生命周期与持仓事件，不自动修改策略参数。
review:
  enabled: true
  journal_path: logs/trading_journal.sqlite
  candidate_log_limit: 100    # 每日最多持久化的合格/近似合格候选数
  paper_min_trading_days: 60  # 候选版本晋级前的最短 paper 前瞻观察期

governance:
  artifact_dir: reports/governance
