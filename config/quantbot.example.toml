[market]
symbols = ["SPY", "AAPL", "MSFT"]
benchmark = "SPY"
timeframe = "1d"

[strategy]
mode = "ai"
breakout_window = 55
exit_window = 45
atr_window = 14
atr_stop_mult = 2.5
swing_k = 3
momentum_window = 126
pullback_depth_atr = 1.5
momentum_filter = "absolute"

[llm]
backend = "openai_compatible"
base_url = "https://api.openai.com/v1"
model = ""
api_key_env = "QUANTBOT_LLM_API_KEY"
fallback_models = []
response_format = "json_object"
timeout_seconds = 45

[codex]
executable = "codex"
reasoning_effort = ""

[risk]
max_weight = 0.20
max_gross_exposure = 0.60
max_positions = 5
risk_per_trade = 0.005
max_portfolio_heat = 0.03
min_confidence = 0.70
cash_buffer = 0.10

[execution]
initial_cash = 100000.0
cost_bps = 5.0
limit_buffer_bps = 50.0
runtime_dir = "runtime"
