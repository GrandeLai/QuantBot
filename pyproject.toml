[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantbot"
version = "0.3.0"
description = "支持可配置大模型决策、价格行为与多因子研究的 AI 量化交易系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.2,<3", "PyYAML>=6.0"]

[project.optional-dependencies]
automation = ["exchange-calendars>=4.5,<5", "yfinance>=0.2.40"]
workbench = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic-settings>=2.3", "loguru>=0.7", "polars>=1.0", "duckdb>=1.1", "redis>=5", "cryptography>=42", "keyring>=25", "python-dotenv>=1", "apscheduler>=3.10", "gitpython>=3.1", "rapidfuzz>=3", "scipy>=1.13", "vaderSentiment>=3.3", "feedparser>=6", "litellm>=1.40", "yfinance>=0.2.40", "exchange-calendars>=4.5,<5", "pyarrow>=15", "akshare>=1.13"]
brokers = ["longbridge>=0.4", "futu-api>=9.3; sys_platform != 'darwin' or platform_machine != 'arm64'", "akshare>=1.13"]
data = ["duckdb>=1.0", "pyarrow>=15", "yfinance>=0.2.40", "requests>=2.31"]
alpaca = ["alpaca-py>=0.28"]
live = ["alpaca-py>=0.28", "ib-insync>=0.9", "APScheduler>=3.10"]
price-action = ["alpaca-py>=0.28", "pyarrow>=15", "yfinance>=0.2.40", "requests>=2.31", "matplotlib>=3.8"]
moomoo = ["moomoo-api>=10.9.6908,<11"]
research = ["scikit-learn>=1.4", "hmmlearn>=0.3", "pyqlib>=0.9", "mlflow>=3.13", "torch>=2", "transformers>=4", "chronos-forecasting>=1.5", "rdagent>=0.3", "matplotlib>=3.8", "ib-insync>=0.9", "APScheduler>=3.10"]
dashboard = ["streamlit>=1.35", "plotly>=5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.20", "ruff>=0.8", "build>=1"]

[project.scripts]
quantbot = "quantbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantbot = ["resources/*.toml", "resources/*.yaml", "web/static/**/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
